name: GameNative WOWBox64 package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''
      variant_name:
        description: 'Optional label added to versionName (<base>-<variant>-<shortsha>)'
        required: false
        default: ''
  pull_request:
  push:
    branches:
      - gamenative-ci
    tags:
      - 'v*'

env:
  LLVM_MINGW_VERSION: '20260922'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 300M
  CMAKE_C_COMPILER_LAUNCHER: ccache

jobs:
  wowbox64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: '0'
        fetch-tags: 'true'

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache cmake python3 gcc

    - name: Cache llvm-mingw
      id: llvm-mingw-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm-mingw
        key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ubuntu-22.04-aarch64

    - name: Download llvm-mingw
      if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$RUNNER_TEMP/llvm-mingw"
        curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz" \
          | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"

    - name: Add llvm-mingw to PATH
      run: echo "$RUNNER_TEMP/llvm-mingw/bin" >> $GITHUB_PATH

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-wowbox64-${{ github.sha }}
        restore-keys: ccache-wowbox64-

    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release \
          -DWOW64=1 -DARM_DYNAREC=1 -DNOBOX64=1
        cmake --build build -j$(nproc)
        ccache -s

    - name: Compute version
      id: version
      env:
        VARIANT: ${{ inputs.variant_name }}
      run: |
        h=src/box64version.h
        base="$(awk '/BOX64_MAJOR/{print $3}' $h).$(awk '/BOX64_MINOR/{print $3}' $h).$(awk '/BOX64_REVISION/{print $3}' $h)"
        sha=$(git rev-parse --short=7 HEAD)
        variant=$(echo "$VARIANT" | tr -c 'A-Za-z0-9._\n' '-')
        echo "version_name=$base${variant:+-$variant}-$sha" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Assemble package
      env:
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
        SHA: ${{ steps.version.outputs.sha }}
        REPO: ${{ github.repository }}
      run: |
        mkdir -p pkg/system32
        cp build/wowbox64-prefix/src/wowbox64-build/wowbox64.dll pkg/system32/
        cat > pkg/profile.json <<JSON
        {
          "type": "WOWBox64",
          "versionName": "$VERSION_NAME",
          "versionCode": 0,
          "description": "WOWBox64 $REPO@${SHA:0:12}",
          "files": [
            {
              "source": "system32/wowbox64.dll",
              "target": "\${system32}/wowbox64.dll"
            }
          ]
        }
        JSON
        python3 -m json.tool pkg/profile.json
        tar -cJf "WOWBox64-$VERSION_NAME.wcp" -C pkg .
        tar -tvJf "WOWBox64-$VERSION_NAME.wcp"
        file pkg/system32/wowbox64.dll || true

    - uses: actions/upload-artifact@v6
      with:
        name: WOWBox64-${{ steps.version.outputs.version_name }}
        path: WOWBox64-${{ steps.version.outputs.version_name }}.wcp
        if-no-files-found: error
        compression-level: 0

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" "WOWBox64-${{ steps.version.outputs.version_name }}.wcp" \
          --repo "$GITHUB_REPOSITORY" --title "WOWBox64 ${{ steps.version.outputs.version_name }}" \
          --notes "Built from ${{ steps.version.outputs.sha }}" \
          || gh release upload "$GITHUB_REF_NAME" "WOWBox64-${{ steps.version.outputs.version_name }}.wcp" --repo "$GITHUB_REPOSITORY" --clobber
